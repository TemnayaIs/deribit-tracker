x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/prices
    REDIS_URL: redis://redis:6379/0
    FETCH_INTERVAL_SECONDS: "60"
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_started

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prices
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prices"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  migrate:
    build: .
    command: ["python", "-m", "app.init_db"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/prices
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info", "--concurrency=1"]

  beat:
    <<: *app
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]

volumes:
  pgdata:
